<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>좋은 시각화 만들기</title>
  <style>
    :root { --ink:#122033; --muted:#6f7b8b; --paper:#f4f0e8; --panel:#fffdf8; --blue:#1f5eff; --orange:#ef7d3b; --mint:#4db6a4; --line:#d8d3c9; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
    body:before { content:""; position:fixed; inset:0; background:radial-gradient(circle at 88% 10%,rgba(31,94,255,.11),transparent 28%),radial-gradient(circle at 9% 86%,rgba(239,125,59,.09),transparent 31%); }
    .slide { position:relative; width:1920px; height:1080px; padding:92px 112px 72px; display:grid; grid-template-columns: 43% 57%; gap:72px; }
    .copy { display:flex; flex-direction:column; justify-content:center; z-index:2; }
    .eyebrow { font-size:21px; font-weight:800; letter-spacing:.18em; color:var(--blue); margin-bottom:30px; }
    h1 { margin:0; font-family:"Noto Serif KR","Batang",serif; font-size:76px; line-height:1.14; letter-spacing:-.045em; white-space:pre-line; }
    .body { margin-top:32px; max-width:690px; font-size:29px; line-height:1.62; letter-spacing:-.025em; color:#435064; }
    .caption { display:inline-flex; align-items:center; width:max-content; max-width:690px; margin-top:38px; padding:13px 20px; border-radius:999px; background:var(--ink); color:white; font-size:20px; font-weight:700; letter-spacing:-.01em; }
    .visual { align-self:center; height:760px; padding:46px; border-radius:42px; background:rgba(255,253,248,.92); border:1px solid rgba(18,32,51,.09); box-shadow:0 36px 90px rgba(35,47,70,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; z-index:2; }
    .brand { position:absolute; left:112px; bottom:38px; font-size:17px; font-weight:800; letter-spacing:.08em; color:#7b8490; }
    .scene { position:absolute; right:112px; bottom:38px; font-size:17px; color:#8b94a1; }
    .opening-mark { position:relative; width:560px; height:560px; }
    .opening-mark .ring { position:absolute; border:2px solid rgba(31,94,255,.22); border-radius:50%; }
    .ring.r1 { inset:0; } .ring.r2 { inset:82px; border-color:rgba(239,125,59,.3); } .ring.r3 { inset:166px; border-color:rgba(77,182,164,.45); }
    .opening-mark .dot { position:absolute; width:30px; height:30px; background:var(--blue); border-radius:50%; left:265px; top:265px; box-shadow:0 0 0 18px rgba(31,94,255,.12); }
    .opening-mark .axis { position:absolute; left:278px; top:36px; width:3px; height:488px; background:linear-gradient(var(--blue),rgba(31,94,255,.05)); transform:rotate(46deg); transform-origin:center; }
    .question-grid { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .q-card { min-height:250px; padding:30px; border:1px solid var(--line); border-radius:28px; display:flex; flex-direction:column; justify-content:space-between; }
    .q-card strong { font-size:31px; } .q-card span { font-size:21px; color:var(--muted); }
    .q-icon { height:92px; display:flex; align-items:center; gap:12px; }
    .node { width:74px; height:46px; border:3px solid var(--blue); border-radius:13px; } .node.small { width:52px; border-color:var(--orange); }
    .arrow { width:72px; height:3px; background:var(--ink); position:relative; } .arrow:after { content:""; position:absolute; right:-2px; top:-6px; border-left:12px solid var(--ink); border-top:7px solid transparent; border-bottom:7px solid transparent; }
    .bar { border-radius:9px; background:var(--blue); height:20px; } .bar.muted { background:#ccd3dd; }
    .before-after { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .mini { height:560px; border:1px solid var(--line); border-radius:28px; padding:28px; }
    .mini.bad { background:#faf9f6; } .mini.good { background:#fff; border:3px solid rgba(31,94,255,.28); }
    .mini .tag { font-weight:800; font-size:18px; color:var(--muted); } .mini h3 { font-family:"Noto Serif KR",serif; font-size:27px; line-height:1.35; margin:22px 0 34px; }
    .bars { display:flex; align-items:flex-end; gap:14px; height:260px; border-left:2px solid #bbc3ce; border-bottom:2px solid #bbc3ce; padding:10px 16px 0; }
    .bars i { width:48px; background:#cbd2dc; display:block; border-radius:9px 9px 0 0; } .good .bars i:nth-child(3) { background:var(--blue); }
    .legend { margin-top:22px; font-size:17px; color:var(--muted); }
    .hierarchy-box { width:100%; }
    .metric { font-size:112px; font-weight:900; color:var(--blue); letter-spacing:-.07em; }
    .metric-label { font-size:27px; font-weight:700; margin-top:-8px; }
    .compare { margin-top:52px; display:grid; gap:18px; }
    .compare-row { display:grid; grid-template-columns:120px 1fr 80px; gap:18px; align-items:center; font-size:21px; }
    .compare-track { height:22px; background:#e4e7eb; border-radius:999px; overflow:hidden; } .compare-fill { height:100%; background:#aeb7c5; border-radius:999px; } .compare-row.primary .compare-fill { background:var(--blue); }
    .footnote { margin-top:54px; padding-top:20px; border-top:1px solid var(--line); font-size:17px; color:#8a929d; }
    .color-board { width:100%; }
    .swatches { display:flex; gap:16px; margin-bottom:54px; }
    .swatch { flex:1; height:120px; border-radius:20px; padding:18px; color:white; font-weight:800; display:flex; align-items:flex-end; }
    .direct-line { display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:center; margin:25px 0; font-size:22px; font-weight:700; }
    .line-sample { height:8px; border-radius:99px; background:var(--blue); } .line-sample.secondary { background:#aeb7c5; width:76%; } .line-sample.warn { background:var(--orange); width:42%; }
    .diagram-board { position:relative; width:100%; height:540px; }
    .d-node { position:absolute; width:210px; min-height:108px; padding:24px; border-radius:24px; background:white; border:2px solid #d6dce5; font-size:24px; font-weight:800; text-align:center; display:flex; align-items:center; justify-content:center; box-shadow:0 18px 30px rgba(20,38,70,.08); }
    .d-node.cause { left:30px; top:215px; border-color:var(--blue); } .d-node.mediator { left:355px; top:80px; border-color:var(--orange); } .d-node.outcome { right:20px; top:215px; border-color:var(--mint); } .d-node.mod { left:355px; bottom:30px; border-style:dashed; }
    .svg-lines { position:absolute; inset:0; width:100%; height:100%; }
    .chart-board { width:100%; position:relative; padding:26px 16px 10px; }
    .chart-title { font-family:"Noto Serif KR",serif; font-size:31px; font-weight:800; margin-bottom:50px; }
    .c-row { display:grid; grid-template-columns:100px 1fr 88px; align-items:center; gap:18px; margin:23px 0; font-size:20px; }
    .c-track { height:38px; background:#e8ebef; border-radius:5px; overflow:hidden; } .c-fill { height:100%; background:#aeb7c5; } .c-row.active .c-fill { background:var(--blue); }
    .source { margin-top:46px; font-size:16px; color:#858e9b; }
    .report-page { width:650px; height:640px; background:white; box-shadow:0 20px 54px rgba(30,42,65,.16); padding:46px 50px; }
    .report-page .headline { font-family:"Noto Serif KR",serif; font-size:28px; font-weight:800; border-bottom:3px solid var(--ink); padding-bottom:19px; }
    .report-chart { height:270px; margin:32px 0 22px; display:flex; align-items:flex-end; gap:24px; border-bottom:1px solid #b7bec8; padding:0 25px; } .report-chart div { width:74px; background:#cbd2dc; } .report-chart div:nth-child(3) { background:var(--blue); }
    .report-text { height:12px; margin:12px 0; background:#dfe3e9; border-radius:5px; } .report-text.short { width:70%; }
    .report-note { margin-top:24px; padding-top:15px; border-top:1px solid #d9dde3; font-size:14px; color:#7b8490; }
    .workflow { width:100%; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
    .step { width:168px; height:168px; border-radius:50%; background:#fff; border:2px solid #d8dde6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:22px; text-align:center; } .step b { color:var(--blue); font-size:17px; }
    .step-arrow { font-size:34px; color:#8a94a3; }
    .tool-grid { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
    .tool { min-height:330px; border-radius:28px; padding:32px; color:white; display:flex; flex-direction:column; justify-content:space-between; }
    .tool:nth-child(1){background:#1f5eff}.tool:nth-child(2){background:#15253a}.tool:nth-child(3){background:#ef7d3b}.tool small{font-size:16px;letter-spacing:.1em}.tool strong{font-size:29px;line-height:1.25}.tool span{font-size:18px;line-height:1.5;opacity:.86}
    .plain-card { width:100%; min-height:520px; padding:44px; border:1px solid var(--line); border-radius:30px; background:#fff; }
    .big-quote { font-family:"Noto Serif KR",serif; font-size:40px; line-height:1.55; font-weight:800; letter-spacing:-.035em; }
    .big-quote em { color:var(--blue); font-style:normal; }
    .micro { margin-top:35px; font-size:19px; line-height:1.6; color:var(--muted); }
    .number-cloud { position:relative; width:100%; height:550px; }
    .number-cloud span { position:absolute; color:#abb4c1; font-weight:750; }
    .number-cloud .pattern { color:var(--blue); font-size:42px; padding:18px 24px; border:3px solid rgba(31,94,255,.25); border-radius:18px; background:#fff; }
    .access-stack { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; align-items:end; }
    .access-step { border-radius:28px 28px 16px 16px; padding:28px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; }
    .access-step:nth-child(1){height:280px;background:#9ba7b7}.access-step:nth-child(2){height:410px;background:#4db6a4}.access-step:nth-child(3){height:560px;background:#1f5eff}
    .access-step b { font-size:23px; }.access-step span{font-size:17px;line-height:1.55;opacity:.88}
    .forms { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
    .form-card { height:560px; border:1px solid var(--line); border-radius:26px; padding:28px; background:#fff; display:flex; flex-direction:column; gap:24px; }
    .form-card h3 { margin:0; font-size:27px; }.form-card p{font-size:19px;line-height:1.7;margin:0;color:#4b5768}.form-card strong{margin-top:auto;font-size:19px;color:var(--blue)}
    .tiny-table { width:100%; border-collapse:collapse; font-size:18px; }.tiny-table th,.tiny-table td{padding:13px 10px;border-bottom:1px solid #dfe3e8;text-align:right}.tiny-table th:first-child,.tiny-table td:first-child{text-align:left}.tiny-table tr.hot{background:#edf3ff;font-weight:800}
    .tiny-chart { height:210px; display:flex; align-items:flex-end; gap:12px; border-bottom:2px solid #aab3c0; padding:0 12px; }.tiny-chart i{flex:1;background:#bec6d1;border-radius:6px 6px 0 0}.tiny-chart i.hot{background:var(--blue)}
    .axis-pair { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:22px; }.axis-card{height:550px;border:1px solid var(--line);border-radius:26px;padding:26px;background:#fff}.axis-card h3{font-size:22px;margin:0 0 28px}.axis-plot{height:400px;position:relative;border-left:2px solid #aeb7c5;border-bottom:2px solid #aeb7c5}.axis-line{position:absolute;left:20px;right:10px;height:5px;background:linear-gradient(90deg,#1f5eff,#ef7d3b);transform:rotate(-12deg);top:180px}.axis-card.misleading .axis-line{transform:rotate(-43deg);top:190px}.axis-label{position:absolute;left:10px;bottom:10px;font-size:16px;color:#737d8b}
    .time-board { width:100%; }.time-chart{height:440px;position:relative;border-left:2px solid #b8c0cb;border-bottom:2px solid #b8c0cb}.event-line{position:absolute;top:0;bottom:0;left:58%;border-left:3px dashed var(--orange)}.event-label{position:absolute;left:60%;top:16px;color:var(--orange);font-weight:800;font-size:19px}.time-svg{position:absolute;inset:28px 20px 24px;width:calc(100% - 40px);height:calc(100% - 52px)}
    .distribution-board { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:24px; }.dist-card{height:520px;border:1px solid var(--line);border-radius:26px;padding:28px;background:#fff}.dist-card h3{font-size:24px}.dots{height:340px;position:relative;border-bottom:2px solid #aeb7c5}.dots i{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(31,94,255,.65)}.mean-line{position:absolute;left:50%;top:10px;bottom:0;border-left:3px dashed var(--orange)}
    .likert { width:100%; }.likert-row{display:grid;grid-template-columns:150px 1fr 74px;gap:14px;align-items:center;margin:26px 0;font-size:18px}.likert-bar{height:36px;display:flex;border-radius:7px;overflow:hidden}.neg{background:#d87379}.neu{background:#d7dce3}.pos{background:#4db6a4}
    .uncertainty-board { width:100%; }.estimate{display:grid;grid-template-columns:130px 1fr 100px;gap:18px;align-items:center;margin:55px 0;font-size:21px}.ci{height:5px;background:#9ca8b8;position:relative}.ci:before,.ci:after{content:"";position:absolute;top:-9px;width:3px;height:22px;background:#9ca8b8}.ci:before{left:0}.ci:after{right:0}.point{position:absolute;left:50%;top:-12px;width:28px;height:28px;border-radius:50%;background:var(--blue);transform:translateX(-50%)}
    .process-board { width:100%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:160px 160px 160px; gap:18px; align-items:center; }.p-box{height:120px;border:2px solid #d4dae3;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:800}.p-box.decision{border-color:var(--orange);transform:rotate(45deg);width:115px;height:115px;justify-self:center}.p-box.decision span{transform:rotate(-45deg)}.p-arrow{text-align:center;font-size:35px;color:#7d8795}.p-return{grid-column:2/4;text-align:center;color:var(--orange);font-size:19px;border-top:3px dashed var(--orange);padding-top:13px}
    .tool-compare { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:20px; }.tool-compare.three{grid-template-columns:repeat(3,1fr)}.tool-compare.four{grid-template-columns:1fr 1fr}.tool-card{min-height:250px;border:2px solid var(--line);border-radius:24px;background:#fff;padding:26px;display:flex;flex-direction:column;gap:18px}.tool-card b{font-size:27px;color:var(--blue)}.tool-card span{font-size:19px;line-height:1.55}.tool-card small{margin-top:auto;font-size:16px;line-height:1.5;color:var(--muted)}
    .tool-axis { width:100%; height:600px; position:relative; border-left:3px solid #aeb7c5; border-bottom:3px solid #aeb7c5; margin:10px 35px 50px 80px; }.tool-axis .dot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--blue)}.tool-axis .dot span{position:absolute;left:30px;top:-5px;white-space:nowrap;font-size:17px;font-weight:800;color:var(--ink)}
    .layer-stack { width:100%; height:610px; position:relative; }.layer{position:absolute;width:54%;height:100px;border:2px solid #9cb3e9;border-radius:18px;background:#e9eefb;padding:18px 25px;font-size:20px;font-weight:800}.layer b{display:block;color:var(--blue);font-size:16px;margin-bottom:8px}
    .tool-choice { width:100%; display:grid; gap:13px; }.choice-row{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:20px;font-size:19px;font-weight:800}.choice-row span:last-child{background:#fff;border:2px solid var(--line);border-left:16px solid var(--blue);border-radius:15px;padding:18px 24px;color:var(--blue)}
    .ai-board { width:100%; display:grid; grid-template-columns:1fr 88px 1fr; gap:20px; align-items:center; }.ai-column{height:550px;border-radius:28px;padding:34px;background:#eef1f5;display:flex;flex-direction:column;justify-content:space-between}.ai-column.after{background:#17283f;color:#fff}.ai-column h3{font-size:30px;margin:0}.ai-column ul{padding-left:23px;font-size:20px;line-height:1.9}.ai-arrow{font-size:52px;text-align:center;color:var(--blue)}
    .prompt-board { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:22px; }.prompt-card{height:560px;border-radius:28px;padding:34px;background:#f0f2f5;border:1px solid var(--line)}.prompt-card.good{background:#fff;border:3px solid rgba(31,94,255,.25)}.prompt-card h3{font-size:25px}.prompt-card p{font-size:20px;line-height:1.7}.prompt-list{display:grid;gap:12px;margin-top:24px}.prompt-list span{padding:12px 15px;border-radius:10px;background:#edf3ff;font-size:18px;font-weight:700}
    .critique-grid { width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }.critique-card{height:480px;border-radius:28px;padding:30px;color:#fff;display:flex;flex-direction:column}.critique-card:nth-child(1){background:#1f5eff}.critique-card:nth-child(2){background:#4db6a4}.critique-card:nth-child(3){background:#ef7d3b}.critique-card b{font-size:54px}.critique-card strong{font-size:27px;margin:38px 0 18px}.critique-card span{font-size:18px;line-height:1.7}
    .check-grid { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:15px 20px; }.check-item{min-height:92px;border:1px solid var(--line);border-radius:20px;padding:20px 24px;background:#fff;display:flex;align-items:center;gap:17px;font-size:21px;font-weight:750}.check-item i{width:34px;height:34px;border-radius:50%;background:#e7efff;border:8px solid var(--blue)}
  </style>
</head>
<body><main id="app"></main>
<script>
  const visual = (kind) => {
    if (kind === 'opening') return `<div class="opening-mark"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="axis"></div><div class="dot"></div></div>`;
    if (kind === 'memory') return `<div class="number-cloud"><span style="left:4%;top:6%;font-size:27px">42.1</span><span style="left:39%;top:3%;font-size:21px">57.8</span><span style="right:7%;top:11%;font-size:32px">31.4</span><span style="left:12%;top:36%;font-size:22px">49.6</span><span class="pattern" style="left:31%;top:29%">상승 ↗</span><span style="right:11%;top:45%;font-size:25px">68.2</span><span style="left:5%;bottom:16%;font-size:34px">24.9</span><span class="pattern" style="right:12%;bottom:8%;color:#ef7d3b;border-color:rgba(239,125,59,.3)">예외!</span><span style="left:42%;bottom:5%;font-size:24px">53.0</span></div>`;
    if (kind === 'access') return `<div class="access-stack"><div class="access-step"><b>과거</b><span>통계 프로그램<br>디자인 소프트웨어<br>전문 제작자</span></div><div class="access-step"><b>지금</b><span>웹 도구<br>템플릿<br>코드 자동화</span></div><div class="access-step"><b>AI 시대</b><span>자연어 요청<br>대화형 수정<br>편집 가능 출력<br><br>판단력은 자동화되지 않는다</span></div></div>`;

    if (kind === 'checklist') return `<div class="check-grid">${['질문이 분명한가','한 문장 결론이 있는가','형식이 질문에 맞는가','축·단위·분모가 정확한가','색의 역할이 일관적인가','출처·불확실성이 보이는가','색 없이도 의미가 전달되는가'].map(x=>`<div class="check-item"><i></i>${x}</div>`).join('')}</div>`;
    return `<div class="tool-grid"><div class="tool"><small>STRUCTURE</small><strong>Diagram<br>Studio</strong><span>관계와 흐름을 편집 가능한 도식으로</span></div><div class="tool"><small>QUANTITATIVE</small><strong>Chart<br>Studio</strong><span>축·단위·라벨이 완성된 비교와 추세</span></div><div class="tool"><small>SURVEY</small><strong>Survey<br>Visualization</strong><span>설문 표와 메타를 일관된 차트북으로</span></div></div>`;
  };
  (async () => {
    const data = await fetch('./storyboard-lecture.json').then(r => r.json());
    const requested = new URLSearchParams(location.search).get('scene') || data.scenes[0].id;
    const index = Math.max(0, data.scenes.findIndex(s => s.id === requested));
    const scene = data.scenes[index];
    document.getElementById('app').innerHTML = `<section class="slide"><div class="copy"><div class="eyebrow">${scene.eyebrow}</div><h1>${scene.title}</h1><div class="body">${scene.body}</div><div class="caption">${scene.caption}</div></div><div class="visual">${visual(scene.kind)}</div><div class="brand">PR STUDIO × METHODIQ</div><div class="scene">${String(index + 1).padStart(2,'0')} / ${String(data.scenes.length).padStart(2,'0')}</div></section>`;
    window.__READY__ = true;
  })();
</script>
</body>
</html>
