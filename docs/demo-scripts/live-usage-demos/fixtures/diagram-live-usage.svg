<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><title>MCP 사용기록형 데모 제작 흐름</title><style>text{fill:#202d32;font:14px Arial,sans-serif}.node{fill:#fff;stroke:#52656e;stroke-width:1.5}.edge{fill:none;stroke:#52656e;stroke-width:1.5}.region{fill:none;stroke:#b8c4c6;stroke-dasharray:4 4}marker path{fill:#52656e}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><path class="edge" d="M 185 80 L 275 80" marker-end="url(#arrow)"/><text x="230" y="70" text-anchor="middle">요청</text><path class="edge" d="M 445 80 L 535 80" marker-end="url(#arrow)"/><text x="490" y="70" text-anchor="middle">도구 호출</text><path class="edge" d="M 535 102.88461538461539 L 185 197.1153846153846" marker-end="url(#arrow)"/><text x="360" y="140" text-anchor="middle">결과 반환</text><path class="edge" d="M 185 220 L 275 220" marker-end="url(#arrow)"/><text x="230" y="210" text-anchor="middle">수정 필요</text><path class="edge" d="M 425 185 L 555 115" marker-end="url(#arrow)"/><text x="490" y="140" text-anchor="middle">다시 실행</text><path class="edge" d="M 185 220 Q 360 100 535 220" marker-end="url(#arrow)"/><text x="360" y="150" text-anchor="middle">확정</text><g data-node="request" transform="translate(100,80)"><title>사용자 자연어 지시</title><rect class="node" x="-85" y="-35" width="170" height="70" rx="35"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">사용자 자연어 지시</tspan></text></g><g data-node="choose" transform="translate(360,80)"><title>AI가 MCP 도구 선택</title><rect class="node" x="-85" y="-35" width="170" height="70" rx="7"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">AI가 MCP 도구 선택</tspan></text></g><g data-node="execute" transform="translate(620,80)"><title>MCP 도구 실행</title><rect class="node" x="-85" y="-35" width="170" height="70" rx="7"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">MCP 도구 실행</tspan></text></g><g data-node="review" transform="translate(100,220)"><title>사람이 결과 확인</title><polygon class="node" points="0,-42 90,0 0,42 -90,0"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">사람이 결과 확인</tspan></text></g><g data-node="revise" transform="translate(360,220)"><title>수정 요청</title><rect class="node" x="-85" y="-35" width="170" height="70" rx="7"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">수정 요청</tspan></text></g><g data-node="done" transform="translate(620,220)"><title>완성본 사용</title><rect class="node" x="-85" y="-35" width="170" height="70" rx="35"/><text text-anchor="middle" y="4"><tspan x="0" dy="0">완성본 사용</tspan></text></g></svg>
